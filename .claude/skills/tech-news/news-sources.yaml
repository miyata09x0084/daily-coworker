# テックニュースソース宣言
#
# 新しいソースを追加したい場合は、このファイルに entry を追加するだけで済む
# （/tech-news コマンド本体の編集は不要）。
#
# URL は公開情報なので直接記載する。秘匿値が必要になったら ${VAR} 表記で .env（gitignore対象）から展開する。
# fetch.strategy は "list-then-detail" / "rss" / "json-list" のいずれか。
# fetch.tool は "webfetch" (デフォルト) または "curl" を指定する。
# curl を使う場合は fetch.user_agent を必須で指定する (bot ブロック回避)。

sources:
  - name: Hacker News
    tag_template: "[HN 🔥{score}]"
    limit: 10
    fetch:
      strategy: list-then-detail
      list_url: https://hacker-news.firebaseio.com/v0/topstories.json
      detail_url_template: https://hacker-news.firebaseio.com/v0/item/{id}.json
    extract:
      title: title
      url: url
      score: score

  - name: TechCrunch
    tag_template: "[TC]"
    limit: 10
    fetch:
      strategy: rss
      url: https://techcrunch.com/feed/
    extract:
      title: title
      url: link
      score: null

  - name: Reddit r/technology
    tag_template: "[Reddit ⬆{score}]"
    limit: 10
    fetch:
      strategy: json-list
      # Reddit は WebFetch をブロックするため curl + User-Agent 回避
      tool: curl
      user_agent: "Mozilla/5.0 (compatible; DailyCoworkerBot/1.0)"
      url: https://www.reddit.com/r/technology/top.json?t=day&limit=10
      list_path: data.children
    extract:
      title: data.title
      url: data.url
      score: data.score

# 出力設定
output:
  dir: output/news
  filename_pattern: "{date}-tech-news.md"
  final_count_range: [10, 20]

# インサイト抽出設定
insights:
  count: 3
  axes:
    - name: 技術トレンド
      description: 何が伸びているか、何を学ぶ/採用すべきか、何が廃れつつあるか
    - name: 業界構造の変化
      description: 規制・M&A・プラットフォームシフトなど、ビジネスの力学がどう動いているか
